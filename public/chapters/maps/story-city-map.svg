<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 430" role="img" aria-label="Anime city story map">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2a4b"/>
      <stop offset="0.48" stop-color="#44345a"/>
      <stop offset="1" stop-color="#1f3044"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5c617b"/>
      <stop offset="0.55" stop-color="#394056"/>
      <stop offset="1" stop-color="#272d40"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.28" cy="0.22" r="0.72">
