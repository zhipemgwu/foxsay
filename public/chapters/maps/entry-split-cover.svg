<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Split illustrated story and encounter app entry cover">
  <defs>
    <linearGradient id="storyBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d465d"/>
      <stop offset="0.45" stop-color="#493756"/>
      <stop offset="1" stop-color="#273a55"/>
    </linearGradient>
    <linearGradient id="encounterBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3456"/>
      <stop offset="0.46" stop-color="#4b3772"/>
      <stop offset="1" stop-color="#183f4d"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1d2"/>
      <stop offset="0.38" stop-color="#ff8a80"/>
      <stop offset="0.72" stop-color="#cdbbff"/>
      <stop offset="1" stop-color="#7ee0d6"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3bb" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff8a80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coolLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ee0d6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#cdbbff" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#7ee0d6" stop-opacity="0.74"/>
