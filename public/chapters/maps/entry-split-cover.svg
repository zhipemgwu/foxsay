    <radialGradient id="encounterGlow" cx="0.78" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#7ee0d6" stop-opacity="0.68"/>
      <stop offset="0.44" stop-color="#b39ddb" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#b39ddb" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="4" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
